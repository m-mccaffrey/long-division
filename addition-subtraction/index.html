<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add &amp; Subtract Quest</title>
<link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>➕➖ Add &amp; Subtract Quest</h1>
      <div class="stats" id="stats">
        <div class="stat">
          <span class="stat-label">Level</span>
          <span class="stat-value" id="statLevel">1</span>
        </div>
        <div class="stat">
          <span class="stat-label">XP</span>
          <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
        </div>
        <div class="stat">
          <span class="stat-label">Score</span>
          <span class="stat-value" id="statScore">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">Streak</span>
          <span class="stat-value" id="statStreak">0 🔥</span>
        </div>
        <div class="stat">
          <span class="stat-label">Best</span>
          <span class="stat-value" id="statBest">0</span>
        </div>
      </div>
    </header>

    <p class="cross-link"><a href="../index.html">🔗 Try Long Division Quest</a></p>

    <section class="controls">
      <div class="control-group" id="difficultyGroup">
        <button class="pill" data-difficulty="twoDigit">Two-Digit</button>
        <button class="pill" data-difficulty="threeDigit">Three-Digit</button>
      </div>
      <div class="control-group" id="operationGroup">
        <button class="pill" data-operation="add">Addition</button>
        <button class="pill" data-operation="sub">Subtraction</button>
        <button class="pill" data-operation="mixed">Mixed</button>
      </div>
      <div class="control-group" id="modeGroup">
        <button class="pill" data-mode="guided">Guided Mode</button>
        <button class="pill" data-mode="free">Free Mode</button>
      </div>
    </section>

    <main class="card" id="gameCard">
      <div class="game-layout">
        <div class="game-left">
          <div class="control-zone">
            <div class="hint-tip" id="hintTip"></div>
            <div class="step-row" id="controlRow"></div>
          </div>
          <div class="feedback" id="feedback"></div>
          <div class="actions">
            <button id="newProblemBtn" class="btn secondary">🔄 New Problem</button>
          </div>
        </div>

        <div class="game-right">
          <div class="as-scroll">
            <div class="as-panel" id="asPanel">
              <div class="as-carry-row" id="asCarryRow"></div>
              <div class="as-top-row" id="asTopRow"></div>
              <div class="as-bottom-row" id="asBottomRow"></div>
              <div class="as-rule" id="asRule"></div>
              <div class="as-answer-row" id="asAnswerRow"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <section class="badges-panel">
      <h2>🏅 Badges</h2>
      <div class="badges" id="badgesRow"></div>
    </section>
  </div>

  <div class="confetti-layer" id="confettiLayer"></div>

  <script src="script.js?v=1"></script>
</body>
</html>
